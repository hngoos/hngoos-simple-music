name: HSM desktop

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            native: windows-x64
            task: packageMsi
          - name: macOS Apple Silicon
            os: macos-15
            native: macos-arm64
            task: packageDmg
          - name: macOS Intel
            os: macos-15-intel
            native: macos-x64
            task: packageDmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wixBin = Get-ChildItem 'C:\Program Files (x86)' -Directory -Filter 'WiX Toolset*' | Select-Object -First 1
          if ($wixBin) { Join-Path $wixBin.FullName 'bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }
      - name: Verify domain and import tests
        run: ./gradlew :domain:jvmTest --no-configuration-cache --console=plain
      - name: Stage verified native playback libraries
        run: ./gradlew :composeApp:mpvSetupAll -PhsmNativeTargets=${{ matrix.native }} --no-configuration-cache --console=plain
      - name: Build native installer
        run: ./gradlew :desktopApp:${{ matrix.task }} --no-configuration-cache --console=plain
      - name: Name platform installers
        env:
          HSM_NATIVE: ${{ matrix.native }}
        run: |
          VERSION=$(sed -n 's/^version-name = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          mkdir -p dist
          while IFS= read -r -d '' package; do
            cp "$package" "dist/HSM-${VERSION}-${HSM_NATIVE}.${package##*.}"
          done < <(find desktopApp/build/compose/binaries/main -type f \( -name '*.msi' -o -name '*.dmg' \) -print0)
      - uses: actions/upload-artifact@v4
        with:
          name: HSM-${{ matrix.native }}
          path: dist/*
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.native }}
          path: core/domain/build/reports/tests/jvmTest
          if-no-files-found: ignore

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HSM-*
          path: installers
      - name: Create draft with all platform installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' packages < <(find installers -type f \( -name '*.msi' -o -name '*.dmg' \) -print0)
          test "${#packages[@]}" -eq 3
          gh release create "$TAG" "${packages[@]}" --draft --title "HSM $TAG" --generate-notes
